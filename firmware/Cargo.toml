[workspace]
members = ["."]
resolver = "2"

[package]
name = "asperitas-firmware"
version = "0.1.0"
edition = "2021"

[features]
default = []
seed3 = []
# Hold the pre-init LED stage on screen for a few seconds before switching to
# Running. Boot is otherwise fast enough that red → green is a single flicker,
# which makes the two stages impossible to tell apart by eye. Bring-up only —
# never enable for normal use.
slow-boot = []

[profile.release]
# probe-rs decodes symbols, backtraces and defmt locations from DWARF; without it a
# release image yields bare addresses and probe-run/probe-rs decline to unwind one.
# The DWARF itself costs no flash: it lives in non-ALLOC `.debug_*` sections, which
# `make build`'s --only-section list leaves out. Measured both ways, firmware.bin is
# 88101 bytes either way — not identical bytes, though: turning on debuginfo perturbs
# codegen enough to move .text by 8 bytes, which re-shuffles every linked address.
# Deliberately no `strip`, `panic` or `lto`: the custom #[panic_handler] assumes the
# default unwinding strategy, and changing it is a call to make after someone has seen
# a real backtrace (TASK-037).
debug = "line-tables-only"

[dependencies]
asperitas-dsp = { path = "../crates/asperitas-dsp" }
asperitas-pod = { path = "../crates/asperitas-pod", features = ["pod-hw"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
daisy-embassy = { git = "https://github.com/daisy-embassy/daisy-embassy", branch = "master", features = ["seed3"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32h750ib", "memory-x", "exti"] }
asperitas-logging = { path = "../crates/asperitas-logging", features = ["log-usb"] }
defmt = "0.3"
embassy-time = "0.5"
embassy-futures = "0.1"
static_cell = "2"
