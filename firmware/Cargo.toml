[workspace]
members = ["."]
resolver = "2"

[package]
name = "asperitas-firmware"
version = "0.1.0"
edition = "2021"

[features]
# The framed USB console is the capture transport and the default: CI's
# `cargo build --release --features seed3` adds to these rather than replacing them, so the
# console build stays exactly what it was. Only `--no-default-features` drops it.
default = ["log-usb"]
# Seed3 hardware always carries the boot-stage LED and the shared panic handler. They are not a
# transport — they are how a board with no host attached reports how far boot got (TASK-036.02),
# and every binary here exists partly to exercise them. Gating them on a transport instead left
# `--no-default-features` with no diagnostics at all and five binaries that could not link.
seed3 = ["asperitas-logging/boot-led"]
# Hold the pre-init LED stage on screen for a few seconds before switching to
# Running. Boot is otherwise fast enough that red → green is a single flicker,
# which makes the two stages impossible to tell apart by eye. Bring-up only —
# never enable for normal use.
slow-boot = []
# Framed console over USB CDC-ACM. The capture tooling parses this stream, so it is what
# `Backend` points at whenever it is on — even with `log-defmt` also on.
log-usb = ["asperitas-logging/log-usb"]
# defmt frames over RTT, streamed by probe-rs. Shares no code with the USB stack: no endpoint,
# no pipe, no drain task. See "Flashing and logging over an ST-Link probe" in
# docs/reference/daisy-seed3.md (TASK-036.04).
log-defmt = ["asperitas-logging/log-defmt", "dep:defmt-rtt"]
# Stimulus generators for `rig`, mutually exclusive by a `const` assert in `src/bin/rig.rs`.
#
# None of them belongs in `default`: `--features seed3,stim-ess` adds to the defaults rather than
# replacing them, so a default `stim-sine` would put two generators in the image CI builds and
# trip rig's own exclusion guard. Selecting no stimulus is meaningful and means sine, which is why
# `stim-sine` exists at all — as an explicit spelling, not as the default one.
stim-sine = []
stim-ess = []
stim-pulse = []

[profile.release]
# probe-rs decodes symbols, backtraces and defmt log locations from DWARF - and it accepts
# no amount of it short of full debug info. At `false`, `1` and `line-tables-only` alike,
# `probe-rs attach <ELF> --chip STM32H750IBKx --non-interactive --list-rtt` prints
#
#   WARN probe_rs::util::rtt::processing: Insufficient DWARF info; compile your program with
#   `debug = 2` to enable location info.
#
# and goes on decoding the stream without locations, so a defmt line arrives with no file and
# no line number. The warning is emitted before probe discovery, which is why that command is
# the check: with no board attached it still prints it, then exits 1 on
# `Error: No connected probes were found.` Only `debug = 2` is silent. Locations are worth
# having, so `2` ships.
#
# Cost, measured 2026-09-13 against the RTT-only image (`--no-default-features --features
# "seed3 log-defmt"`), one fresh target dir per row, `main.bin` cut by `make build`'s plain
# `-O binary` with no section list:
#
#   debug               rustc flag                        ELF        .debug_*   .debug_info  main.bin
#   false               (none passed)                   261,484          0            -          48,124
#   "line-tables-only"  -C debuginfo=line-tables-only   3,012,380  2,750,373      917,639      48,124
#   1                   -C debuginfo=1                  4,738,792  4,476,827    1,183,176      48,124
#   2 (shipped)         -C debuginfo=2                  9,496,376  9,233,747    3,559,850      48,360
#
# Read the table as one snapshot of one commit. Every cell above was re-cut on 2026-09-13; the
# copy it replaced, cut 2026-09-12 and partly at `a1376f3`, said 48,084 / 48,084 / 48,228 / 48,320
# down the `main.bin` column and `.text` 39,096 in the shipped row. Both sets are quoted rather than
# one deleted because the gap is code added between the measurements, not a dispute about either,
# and 48,360 is what `firmware/Makefile` reports today for the same feature set. Setting
# `DEFMT_LOG=info` moves the shipped cell again, to 48,504 measured the same day. Reproduce a row
# with:
#
#   CARGO_TARGET_DIR=$(mktemp -d) CARGO_PROFILE_RELEASE_DEBUG=<level> \
#     make build NO_DEFAULT=1 FEATURES="seed3 log-defmt"
#
# Use the environment override rather than `RUSTFLAGS`: `RUSTFLAGS` takes precedence over the
# `rustflags` in `firmware/.cargo/config.toml` rather than adding to it, so dropping
# `-C link-arg=-Tlink.x` on the floor links an image unrelated to any memory map (measured: an
# 8,896-byte `main.bin`).
#
# Keep the temporary target dir. Without it this relinks `target/.../release/main` and leaves the
# RTT image where the console image was, and that ELF is the decoder every probe command reads with.
#
# Two prices and only one of them is flash. Host-side, the ELF goes 3.0 MB -> 9.5 MB, because
# that is where the DWARF lives: all 9.2 MB of it sits in non-ALLOC `.debug_*` sections, which a
# memory-image copy skips without being told to. Flash-side it is 236 bytes of the
# 131,072-byte internal-flash budget, 48,124 -> 48,360, both cells read off the table above. That
# 236 is not a rounding artifact either - debuginfo perturbs codegen, holding `.text` at 38,880
# through `false`, line tables and `1`, then moving it to 39,136 here, while loading none of the
# debug bytes. So a size figure is a per-level measurement rather than an invariant: quote one
# across levels, or across commits that added code, and it is wrong. Clean-build wall time is
# unaffected: one fresh-target-dir release build each, 20 s at `false` against 21 s here.
#
# Deliberately no `strip`, `panic` or `lto`: the custom #[panic_handler] assumes the default
# unwinding strategy, and changing it is a call to make after someone has seen a real backtrace
# (TASK-037). Whether `2` decodes a panic backtrace further than line tables did is also
# TASK-037's to measure; its notes carry why probe-rs #896/#2274/#3309 make a truncated trace
# normal at any level.
debug = 2

[dependencies]
asperitas-dsp = { path = "../crates/asperitas-dsp" }
asperitas-pod = { path = "../crates/asperitas-pod", features = ["pod-hw"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
daisy-embassy = { git = "https://github.com/daisy-embassy/daisy-embassy", branch = "master", features = ["seed3"] }
# `executor-interrupt` is for `rig`, whose audio callback runs on an `InterruptExecutor` woken by
# SAI1. It changes the compiled executor unit for every binary here, which is why CI's two firmware
# builds (neither of which passes `--bin`) are what prove the other five still link.
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32h750ib", "memory-x", "exti"] }
asperitas-logging = { path = "../crates/asperitas-logging", default-features = false }
# Major 1, matching daisy-embassy / embassy-stm32. Was "0.3", and the wire format is versioned per
# major while probe-rs decodes the ELF against it, so 1.x is a correctness requirement here rather
# than tidiness - but this line does NOT leave one major in the graph. Cargo.lock still resolves
# `defmt 0.3.100` (Cargo.lock:279) beside our 1.1.1, pulled by two of our own transitive deps:
# embassy-stm32's `defmt` feature enables stm32-metapac's, and embassy-net-driver asks for 0.3
# directly (reproduce with `cargo tree -e features -i defmt@0.3.100 --features seed3,log-defmt`,
# measured 2026-09-12). That 0.3 is a shim over 1.x, so the wire format is still single-major; its
# own docs say so (`defmt-0.3.100/src/lib.rs:9-11`): "This is a defmt-0.3 compatbility [sic]
# crate. It depends upon `defmt-1.0` and re-exports the items that were available in `defmt-0.3`.
# This allows you to mix defmt-0.3 and defmt-1.0 within the same compilation." Its sole lock entry
# dependency is `defmt 1.1.1` (Cargo.lock:283-285). Both parents are at their latest published
# versions as of 2026-09-12 - embassy-net-driver 0.2.0, stm32-metapac 21.0.0 - so removing the shim
# is waiting on upstream, not a bump we can make.
defmt = "1"
# The RTT logger: supplies `_defmt_write` / `_defmt_acquire` / `_defmt_release` / `_defmt_flush`.
# Linked by the binaries under `log-defmt` (see the note in src/bin/main.rs), not by the facade.
# All three of its knobs are at their defaults deliberately, not overlooked: `disable-blocking-mode`
# off, because an attached host then means lossless (`docs/reference/daisy-seed3.md`'s loss table);
# `drop-on-contention` off, because it drops frames by design and is ARM-only (`compile_error!` at
# `defmt-rtt/src/lib.rs:56-57`); `DEFMT_RTT_BUFFER_SIZE` unset, because the 1024-byte default is the
# ring the frame-size assert in `crates/asperitas-logging/src/defmt_log.rs` measures against.
defmt-rtt = { version = "1", optional = true }
embassy-time = "0.5"
embassy-futures = "0.1"
static_cell = "2"
