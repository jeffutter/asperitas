# lefthook config — local git hooks for Asperitas
# Installed automatically by the nix shell (see flake.nix shellHook).

pre-commit:
  commands:
    fmt-check:
      run: cargo fmt --all --check
      forward_stderr: true

    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      forward_stderr: true

    # Default features leave asperitas-logging's record-path code unlinted; this is the only gate
    # that compiles it with warnings fatal. Landed with TASK-047.
    clippy-log-usb:
      run: cargo clippy -p asperitas-logging --features log-usb --lib -- -D warnings
      forward_stderr: true

    # And the same for the defmt-over-RTT bridge, which no default-feature build compiles at all.
    clippy-log-defmt:
      run: cargo clippy -p asperitas-logging --features log-defmt --lib -- -D warnings
      forward_stderr: true

pre-push:
  commands:
    fmt-check:
      run: cargo fmt --all --check
      forward_stderr: true

    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      forward_stderr: true

    clippy-log-usb:
      run: cargo clippy -p asperitas-logging --features log-usb --lib -- -D warnings
      forward_stderr: true

    clippy-log-defmt:
      run: cargo clippy -p asperitas-logging --features log-defmt --lib -- -D warnings
      forward_stderr: true

    # Cargo.toml's [lints.rustdoc] denies the two cross-reference lints for this crate alone,
    # from the source tree only. These two commands are the other layer: RUSTDOCFLAGS makes
    # *every* rustdoc warning fatal, and the second one documents the feature combination the
    # device build actually uses, without which usb.rs and led.rs are never documented at all.
    doc-links:
      run: RUSTDOCFLAGS="-D warnings" cargo doc -p asperitas-logging --no-deps
      forward_stderr: true

    doc-links-device:
      run: RUSTDOCFLAGS="-D warnings" cargo doc -p asperitas-logging --no-deps --features boot-led,log-usb,log-defmt
      forward_stderr: true

    test:
      run: cargo test --workspace
      forward_stderr: true

    firmware-cross-compile:
      root: "firmware/"
      run: cargo build --release --features seed3
      forward_stderr: true
