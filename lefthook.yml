# Each stage runs scripts/gates.sh at its tier; the gate set is defined there and only there.
# No path filters (root, glob, files, only): a filtered job with an empty set exits 0 without
# running, which reads as green having checked nothing.
# stdout, parallel and interactive are left at their defaults: they trade away fail-fast or
# need a tty.
# lefthook skips a stage on an empty staged set (--allow-empty commits); nothing configurable
# changes that.

min_version: 2.1.10

pre-commit:
  commands:
    gates:
      run: bash scripts/gates.sh commit

pre-push:
  commands:
    gates:
      run: bash scripts/gates.sh push
