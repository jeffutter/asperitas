# lefthook config — local git hooks for Asperitas
# Installed automatically by the nix shell (see flake.nix shellHook).

pre-commit:
  commands:
    # Cheapest gate here on purpose: reads firmware/Makefile's rules with make -n and greps the
    # docs, so it costs a fifth of a second and never builds. Landed with TASK-058.
    doc-artifact-names:
      run: scripts/check-doc-artifact-names.sh
      forward_stderr: true

    fmt-check:
      run: cargo fmt --all --check
      forward_stderr: true

    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      forward_stderr: true

    # Default features leave asperitas-logging's record-path code unlinted; this is the only gate
    # that compiles it with warnings fatal. Landed with TASK-047.
    clippy-log-usb:
      run: cargo clippy -p asperitas-logging --features log-usb --lib -- -D warnings
      forward_stderr: true

    # And the same for the defmt-over-RTT bridge, which no default-feature build compiles at all.
    clippy-log-defmt:
      run: cargo clippy -p asperitas-logging --features log-defmt --lib -- -D warnings
      forward_stderr: true

pre-push:
  commands:
    doc-artifact-names:
      run: scripts/check-doc-artifact-names.sh
      forward_stderr: true

    fmt-check:
      run: cargo fmt --all --check
      forward_stderr: true

    clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      forward_stderr: true

    clippy-log-usb:
      run: cargo clippy -p asperitas-logging --features log-usb --lib -- -D warnings
      forward_stderr: true

    clippy-log-defmt:
      run: cargo clippy -p asperitas-logging --features log-defmt --lib -- -D warnings
      forward_stderr: true

    # Root Cargo.toml's [workspace.lints.rustdoc] denies the two cross-reference lints for every
    # member that opts in, from the source tree only. These two commands are the other layer:
    # RUSTDOCFLAGS makes *every* rustdoc warning fatal across the whole workspace. Neither run is
    # a superset of the other -- default features document logging's fn.init() but not usb.rs,
    # led.rs or panic_handler.rs; --all-features gains those and loses fn.init().
    doc-links:
      run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      forward_stderr: true

    doc-links-all-features:
      run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features
      forward_stderr: true

    test:
      run: cargo test --workspace
      forward_stderr: true

    firmware-cross-compile:
      root: "firmware/"
      run: cargo build --release --features seed3
      forward_stderr: true
