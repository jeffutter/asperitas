[package]
name = "asperitas-logging"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Boot-stage LED indicator + the shared panic handler. Needs GPIO, a timer for the
# pre-init blink, and a singleton cell — but no transport. `log-usb` enables this.
boot-led = ["dep:embassy-stm32", "dep:embassy-time", "dep:static_cell"]
# USB CDC-ACM serial transport. The three `dep:` entries `boot-led` also lists are
# repeated deliberately: this feature stays honest about what it needs even if
# `boot-led` changes later.
log-usb = ["boot-led", "dep:embassy-usb", "dep:embassy-stm32", "dep:embassy-futures", "dep:embassy-time", "dep:static_cell", "dep:embassy-sync"]
# defmt-over-RTT transport. Only `dep:defmt` is the transport itself — the encoder emits
# frames into whatever global logger the *binary* links, which is `defmt-rtt`, and that has
# to sit in the binary crate (see the note in `firmware/src/bin/main.rs`). The rest repeats
# what `boot-led` needs, for the same reason `log-usb` spells them out.
log-defmt = ["boot-led", "dep:defmt", "dep:embassy-stm32", "dep:embassy-time", "dep:static_cell"]

[dependencies]
log = { version = "0.4", default-features = false }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }

# log-defmt dependency. Major must stay 1.x to match daisy-embassy / embassy-stm32: the defmt
# wire format is versioned per major, so two majors in one link means the host decoder cannot
# read what the firmware wrote.
defmt = { version = "1", optional = true }

# log-usb dependencies — versions must match daisy-embassy
embassy-usb = { version = "0.6.0", optional = true }
embassy-stm32 = { version = "0.6.0", optional = true, default-features = false, features = ["stm32h750ib"] }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true }
static_cell = { version = "2", default-features = false, optional = true }
embassy-sync = { version = "0.6", optional = true }

# Host-only test dependencies. `frame` is pure logic and must build and test with
# default features (no `log-usb`), so its tests pull embassy-sync in here rather
# than the module depending on it. Dev-deps never reach the `firmware/` workspace,
# which keeps `firmware/Cargo.lock` unchanged.
#
# `base64` joins them as the oracle for `dump`'s codec: the strict rules that make
# corruption visible are only trustworthy because they were measured against the
# reference implementation, so the reference belongs in the test suite and nowhere
# else — the device-side encoder is hand-written and links nothing.
[dev-dependencies]
proptest = "1"
embassy-sync = "0.6"
base64 = "0.23"

# Read by rustdoc only: `cargo build/check/clippy/test` never see this table, so a plain
# `cargo doc` fails on a broken cross-reference without anyone setting RUSTDOCFLAGS.
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
