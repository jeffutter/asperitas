[package]
name = "asperitas-live"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "asperitas-live"
path = "src/main.rs"

[dependencies]
asperitas-dsp = { path = "../asperitas-dsp", features = ["std"] }
asperitas-cli = { path = "../asperitas-cli" }
clap = { version = "4", features = ["derive"] }
cpal = "0.18.2"
crossterm = "0.29"
ringbuf = "0.5.3"

[dev-dependencies]
tempfile = "3"

# Inherit the workspace rustdoc denies (see root Cargo.toml).
[lints]
workspace = true
