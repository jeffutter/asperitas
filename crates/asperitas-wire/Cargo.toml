[package]
name = "asperitas-wire"
version = "0.1.0"
edition = "2021"

# The wire protocol between the device and the host: frame codec, console and control
# grammars, audio-dump and excerpt formats, capture geometry. Pure `no_std` arithmetic on byte
# slices, so the firmware, the host tools and the tests all link the same code. `log` is here
# only for `Level`, the type `frame::encode` takes; nothing in this crate installs a logger.
[dependencies]
log = { version = "0.4", default-features = false }
# `dump`'s codec. Without default features it is `no_std` and allocation-free through the slice
# API, and its default engine config is the strict canonical-padding contract the transport needs.
base64 = { version = "0.23", default-features = false }

# Host-only test dependencies. `frame` is pure logic and must build and test with no
# transport, so its tests pull embassy-sync in here rather than the module depending on it.
# Dev-deps never reach the `firmware/` workspace.
[dev-dependencies]
proptest = "1"
embassy-sync = "0.6"

[lints]
workspace = true
