[package]
name = "asperitas-measure"
version = "0.1.0"
edition = "2021"

[dependencies]
asperitas-wire = { path = "../asperitas-wire" }
asperitas-dsp = { path = "../asperitas-dsp" }
# Pure-Rust zstd decoder: no C toolchain needed to build the host tooling.
ruzstd = "0.8.2"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
