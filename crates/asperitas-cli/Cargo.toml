[package]
name = "asperitas-cli"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "asperitas-cli"
path = "src/main.rs"

[dependencies]
asperitas-dsp = { path = "../asperitas-dsp", features = ["std"] }
clap = { version = "4", features = ["derive"] }
hound = "3.5"
# Signal generators use libm rather than std's float methods so golden files stay
# reproducible across platforms and toolchains. See synth::generate_sweep.
libm = "0.2"

[dev-dependencies]
tempfile = "3"
