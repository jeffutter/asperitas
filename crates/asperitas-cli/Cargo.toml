[package]
name = "asperitas-cli"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "asperitas-cli"
path = "src/main.rs"

[dependencies]
asperitas-dsp = { path = "../asperitas-dsp", features = ["std"] }
asperitas-stimulus = { path = "../asperitas-stimulus", features = ["std"] }
clap = { version = "4", features = ["derive"] }
hound = "3.5"

[dev-dependencies]
tempfile = "3"

# Inherit the workspace rustdoc denies (see root Cargo.toml).
[lints]
workspace = true
