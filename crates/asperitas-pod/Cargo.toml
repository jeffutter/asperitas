[package]
name = "asperitas-pod"
version = "0.1.0"
edition = "2021"

[features]
default = []
pod-hw = ["dep:embassy-stm32"]

[dependencies]
# embassy-time types (Instant, Duration) are plain u64-backed structs —
# usable without hardware for host-side testing of the ticker guard predicate.
embassy-time = { version = "0.5", default-features = false }

# pod-hw dependencies — versions must match daisy-embassy
embassy-stm32 = { version = "0.6.0", optional = true, default-features = false, features = ["stm32h750ib"] }
