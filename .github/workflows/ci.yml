name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # CI enters `.#ci`, not `.#default`: the only difference is the patched probe-rs, a long
      # from-source build no gate uses. The toolchain comes from the shared definition in flake.nix,
      # so the `rustc -vV` the cache key is built from is identical.
      # The shellHook must print nothing on stdout: rust-cache parses `nix develop --command rustc -vV`.
      - name: Dev shell entry is silent on stdout (rust-cache parses it)
        run: scripts/check-devshell-stdout.sh ci

      # Diagnostic only, not a gate: records which toolchain the cache key names (the nix sysroot,
      # not the runner image's preinstalled Rust).
      - name: Toolchain identity the cache key is built from
        run: |
          nix develop .#ci --command bash -c 'printf "rustc  %s\n" "$(command -v rustc)"; printf "cargo  %s\n" "$(command -v cargo)"; printf "rustup %s\n" "$(command -v rustup || echo none)"; rustc -vV'

      # Two workspaces are named because firmware/ is excluded from the root workspace and has its
      # own Cargo.lock and target dir; naming only "." would leave every firmware build cold.
      #
      # Sources are deliberately not in the key. The action caches dependency artifacts only
      # (`cache-workspace-crates` stays false), so nothing stale survives for a gate to mistake for a
      # pass. Do not set it, and do not add mtime-rewriting actions: cargo trusts mtimes.
      #
      # rust-cache over sccache because sccache never caches crates that invoke the linker (every
      # firmware binary and host test binary) and refuses incremental builds. Pinned to the commit
      # rather than `@v2` so the tree this was reviewed against is the tree that runs.
      #
      # `key:` hashes flake.lock, which pins the toolchain, as a backstop for a `cmd-format` that
      # silently falls back: that degrades to a cold cache instead of a key blind to toolchain changes.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            firmware -> target
          cmd-format: nix develop .#ci --command {0}
          key: nix-${{ hashFiles('flake.lock') }}
          # Pull requests read main's cache but do not add their own, so unmerged branches cannot
          # churn the cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Without this a failed job skips the save step and the next run pays full price.
          cache-on-failure: true

      # No check list lives here: scripts/gates.sh defines every gate once, and lefthook's hooks ask
      # it for their own tiers. The tier is passed explicitly so the workflow states what it runs.
      - name: fmt + clippy + doc + test + firmware cross-build
        run: nix develop .#ci --command bash scripts/gates.sh ci
