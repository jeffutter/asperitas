name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      # The check list itself lives in .github/ci-steps.sh, not in an inline `bash -c '...'`
      # string here. That shape cannot carry comments: the whole list is one single-quoted argument,
      # so an apostrophe in a comment closes the quote and the outer shell re-parses what follows.
      # bash runs a script command by command as it reads it, so every check appears to pass and
      # the step only then dies on an unterminated-quote error -- which is how
      # it sat broken since 6d7d38a, unnoticed because nothing was pushed after CI last ran.
      # A committed file takes normal comments, gets `bash -n`'d by lefthook before commit, and
      # diffs on its own. Add checks there.
      - name: fmt + clippy + test + firmware cross-compile
        run: nix develop .#default --command bash .github/ci-steps.sh
